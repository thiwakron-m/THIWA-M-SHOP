
<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">

  <link rel="icon" href="https://fav.farm/🍁">
  <title>THIWA M SHOP - OLD SCHOOL MARKET</title>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #loading, #blocked, #error {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #111;
      z-index: 10;
    }

    #blocked, #error, #shop {
      display: none;
    }

    h2 { margin-bottom: 12px; }

    p {
      color: #bbb;
      line-height: 1.6;
    }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #d69b32;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <div id="loading">
    <h2>🍁 THIWA M SHOP</h2>
    <p>กำลังตรวจสอบพื้นที่การเข้าใช้งาน...</p>
  </div>

  <div id="blocked">
    <h2>⛔ ไม่อนุญาตให้เข้าใช้งาน</h2>
    <p>เว็บไซต์นี้เปิดให้บริการเฉพาะผู้ใช้งานจากประเทศไทยเท่านั้น</p>
  </div>

  <div id="error">
    <h2>⚠️ ไม่สามารถตรวจสอบประเทศได้</h2>
    <p>กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p>
    <button onclick="checkCountry()">ลองอีกครั้ง</button>
  </div>

  <div id="shop"></div>

  <script>
    const SHOP_URL =
      "https://script.google.com/macros/s/AKfycbyndSm6uBv2gAHoqyzIAVb-R54Pz8ARVszX_gCh0b-lJKG8inmjfafzSVpVu2bbukFk1w/exec";

    async function checkCountry() {
      document.getElementById("loading").style.display = "flex";
      document.getElementById("blocked").style.display = "none";
      document.getElementById("error").style.display = "none";
      document.getElementById("shop").style.display = "none";

      try {
        const response = await fetch("https://ipwho.is/", {
          cache: "no-store"
        });

        if (!response.ok) throw new Error("API error");

        const data = await response.json();

        if (!data.success || !data.country_code) {
          throw new Error("Country detection failed");
        }

        document.getElementById("loading").style.display = "none";

        if (data.country_code === "TH") {
          const iframe = document.createElement("iframe");
          iframe.src = SHOP_URL;
          iframe.setAttribute("frameborder", "0");

          document.getElementById("shop").appendChild(iframe);
          document.getElementById("shop").style.display = "block";
        } else {
          document.getElementById("blocked").style.display = "flex";
        }

      } catch (error) {
        document.getElementById("loading").style.display = "none";
        document.getElementById("error").style.display = "flex";
      }
    }

    checkCountry();
  </script>

</body>
</html>
