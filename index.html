
<script>
  const SHOP_URL =
    "https://script.google.com/macros/s/AKfycbx81L5v7FxBH9tdrjDtNKpzut6cuJQTWQaiBtSrCpVjuZAcS183L5Xz6YIDKQFXbwcqWg/exec";

  async function checkCountry() {
    const loading = document.getElementById("loading");
    const blocked = document.getElementById("blocked");
    const error = document.getElementById("error");
    const shop = document.getElementById("shop");

    loading.style.display = "flex";
    blocked.style.display = "none";
    error.style.display = "none";
    shop.style.display = "none";

    try {
      // ตรวจสอบประเทศจาก 2 API พร้อมกัน
      const providers = [
        async function () {
          const response = await fetch("https://ipwho.is/", {
            cache: "no-store"
          });

          if (!response.ok) throw new Error("ipwho error");

          const data = await response.json();

          if (!data.success || !data.country_code) {
            throw new Error("Invalid ipwho response");
          }

          return data.country_code.toUpperCase();
        },

        async function () {
          const response = await fetch("https://ipapi.co/json/", {
            cache: "no-store"
          });

          if (!response.ok) throw new Error("ipapi error");

          const data = await response.json();

          if (!data.country_code) {
            throw new Error("Invalid ipapi response");
          }

          return data.country_code.toUpperCase();
        }
      ];

      // ใช้ API ตัวแรกที่ตรวจสอบสำเร็จ
      const countryCode = await Promise.any(
        providers.map(function (provider) {
          return provider();
        })
      );

      if (countryCode !== "TH") {
        loading.style.display = "none";
        blocked.style.display = "flex";
        return;
      }

      // เริ่มโหลดร้านค้า
      const iframe = document.createElement("iframe");

      iframe.src = SHOP_URL;
      iframe.setAttribute("frameborder", "0");

      iframe.onload = function () {
        loading.style.display = "none";
      };

      shop.innerHTML = "";
      shop.appendChild(iframe);
      shop.style.display = "block";

    } catch (err) {
      console.error("Country Check Error:", err);

      loading.style.display = "none";
      error.style.display = "flex";
    }
  }

  checkCountry();
</script>
