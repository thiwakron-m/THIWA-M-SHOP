
<!DOCTYPE html>
<html lang="th">
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <base target="_top">

  <link rel="icon" href="https://fav.farm/🍁">
  <title>THIWA M SHOP - OLD SCHOOL MARKET</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
    }

    #loading, #blocked, #error {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
      padding: 24px;
      background: #111;
      z-index: 10;
    }

    #blocked, #error, #shop {
      display: none;
    }

    h2 {
      margin-bottom: 12px;
    }

    p {
      color: #bbb;
      line-height: 1.6;
    }

    button {
      margin-top: 16px;
      padding: 12px 28px;
      border: 0;
      border-radius: 8px;
      background: #d69b32;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }

    iframe {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 0;
    }
  </style>
</head>

<body>

  <!-- Loading -->
  <div id="loading">
    <h2>🍁 THIWA M SHOP</h2>
    <p>กำลังตรวจสอบการเข้าใช้งาน...</p>
  </div>

  <!-- Blocked -->
  <div id="blocked">
    <h2>⛔ ไม่อนุญาตให้เข้าใช้งาน</h2>
    <p>เว็บไซต์นี้ปิดเป็นทางการแล้ว</p>
  </div>

  <!-- Error -->
  <div id="error">
    <h2>⚠️ ไม่สามารถตรวจสอบประเทศได้</h2>
    <p>กรุณาตรวจสอบอินเทอร์เน็ตแล้วลองใหม่อีกครั้ง</p>
    <button onclick="checkCountry()">ลองอีกครั้ง</button>
  </div>

  <!-- Shop -->
  <div id="shop"></div>

  <script>
    const SHOP_URL =
      "https://script.google.com/macros/s/AKfycbx81L5v7FxBH9tdrjDtNKpzut6cuJQTWQaiBtSrCpVjuZAcS183L5Xz6YIDKQFXbwcqWg/exec";


    // ============================================================
    // COUNTRY CHECK
    // ตรวจสอบประเทศจาก API 2 แห่งพร้อมกัน
    // ============================================================

    async function checkCountry() {

      const loading = document.getElementById("loading");
      const blocked = document.getElementById("blocked");
      const error = document.getElementById("error");
      const shop = document.getElementById("shop");

      loading.style.display = "flex";
      blocked.style.display = "none";
      error.style.display = "none";
      shop.style.display = "none";

      shop.innerHTML = "";

      try {

        const providers = [

          // API 1
          async function () {

            const response = await fetch(
              "https://ipwho.is/",
              { cache: "no-store" }
            );

            if (!response.ok) {
              throw new Error("ipwho API error");
            }

            const data = await response.json();

            if (!data.success || !data.country_code) {
              throw new Error("Invalid ipwho response");
            }

            return data.country_code.toUpperCase();
          },

          // API 2
          async function () {

            const response = await fetch(
              "https://ipapi.co/json/",
              { cache: "no-store" }
            );

            if (!response.ok) {
              throw new Error("ipapi API error");
            }

            const data = await response.json();

            if (!data.country_code) {
              throw new Error("Invalid ipapi response");
            }

            return data.country_code.toUpperCase();
          }

        ];


        // รอ API ตัวแรกที่ตอบกลับสำเร็จ
        const countryCode = await Promise.any(
          providers.map(function (provider) {
            return provider();
          })
        );


        // ========================================================
        // BLOCK FOREIGN COUNTRIES
        // ========================================================

        if (countryCode !== "TH") {

          loading.style.display = "none";
          blocked.style.display = "flex";

          return;
        }


        // ========================================================
        // LOAD SHOP
        // ========================================================

        const iframe = document.createElement("iframe");

        iframe.src = SHOP_URL;
        iframe.setAttribute("frameborder", "0");

        iframe.onload = function () {
          loading.style.display = "none";
        };

        shop.appendChild(iframe);
        shop.style.display = "block";


      } catch (err) {

        console.error("Country Check Error:", err);

        loading.style.display = "none";
        error.style.display = "flex";

      }

    }


    // ============================================================
    // START
    // ============================================================

    checkCountry();

  </script>

</body>
</html>
